# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# DEV app config (the file `npm run dev` uses). Production gets its own file later.

client_id = "eab42ea7f7b0d8bf86b3e2dbd01ee837"
application_url = "https://example.com"      # replaced automatically by `shopify app dev`
embedded = true
name = "Regional Products"

[webhooks]
# Admin API version used by direct API access. Stable release.
api_version = "2026-07"

[access_scopes]
# UNVERIFIED: starting guess. Trim or fix on dev-appsdapps, then keep the same
# list in the production toml.
scopes = "read_locations,read_markets,read_products,read_publications,read_shipping,write_publications,write_shipping"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
