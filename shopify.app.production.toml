# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# PRODUCTION app config (for Hardman). Released with `npm run deploy`.
# There is no separate dev app: test by pushing to GitHub and reloading the app in the store admin.

client_id = "aaebd262b3b8b876abf919bcc9d31e36"
application_url = "https://ad-regional-products.pages.dev"
embedded = true
name = "AD Regional Products"

[access_scopes]
# Keep in step with the scopes the code needs.
scopes = "read_locations,read_markets,read_products,read_publications,read_shipping,read_themes,write_publications,write_shipping"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = [ "https://ad-regional-products.pages.dev/api/auth" ]

[webhooks]
# Admin API version used by direct API access. Stable release.
api_version = "2026-07"

[build]
include_config_on_deploy = true
